<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 1200 760"
     role="img"
     aria-labelledby="muscle-map-title muscle-map-desc"
     class="muscle-map muscle-map--male">
  <title id="muscle-map-title">Male front and back muscle anatomy map</title>
  <desc id="muscle-map-desc">Original neutral male muscle anatomy map with front and back training zones.</desc>

  <style>
    .muscle-map {
      --paper: #fbfbf7;
      --band: #f1f3f4;
      --outline: #4a515b;
      --skin: #fbfaf6;
      --line: #68707b;
      --line-soft: rgba(86, 95, 106, .32);
      --tone-light: #d4d7db;
      --tone: #b9bec5;
      --tone-mid: #9fa6af;
      --tone-deep: #858d98;
      --tone-dark: #717a86;
      --cut-color: #18bfae;
      --bulk-color: #ff684b;
      --cut-active: 0;
      --bulk-active: 0;
    }

    .page-bg {
      fill: transparent;
    }

    .anatomy-band {
      fill: var(--band);
      opacity: .95;
    }

    .floor {
      fill: #e2e5ea;
      opacity: .72;
    }

    .label {
      fill: #7d8795;
      font-family: Arial, "Microsoft YaHei", sans-serif;
      font-size: 16px;
      font-weight: 800;
      letter-spacing: 6px;
    }

    .silhouette {
      fill: #f6f6f2;
      stroke: var(--outline);
      stroke-width: 2.3;
      stroke-linejoin: round;
      stroke-linecap: round;
    }

    .skin {
      fill: var(--skin);
      stroke: var(--outline);
      stroke-width: 2;
      stroke-linejoin: round;
      stroke-linecap: round;
    }

    .muscle {
      cursor: pointer;
      outline: none;
      transform-box: fill-box;
      transform-origin: center;
      transition: filter 160ms ease, transform 160ms ease;
    }

    .muscle:hover,
    .muscle:focus-visible {
      filter: brightness(1.08) drop-shadow(0 0 5px rgba(40, 52, 60, .24));
    }

    .zone {
      stroke: var(--line);
      stroke-width: 1.55;
      stroke-linejoin: round;
      stroke-linecap: round;
    }

    .light { fill: var(--tone-light); }
    .soft { fill: var(--tone); }
    .mid { fill: var(--tone-mid); }
    .deep { fill: var(--tone-deep); }
    .dark { fill: var(--tone-dark); }

    .fiber,
    .cut-line {
      fill: none;
      stroke: rgba(255, 255, 255, .34);
      stroke-width: 1.15;
      stroke-linecap: round;
      pointer-events: none;
    }

    .cut-line {
      stroke: var(--line-soft);
      stroke-width: 1.3;
    }

    .cardio-ring {
      fill: none;
      stroke: #77818d;
      stroke-width: 2.6;
      stroke-linecap: round;
      stroke-dasharray: 10 12;
      opacity: .28;
    }

    .cardio-pulse {
      fill: none;
      stroke: #626b76;
      stroke-width: 3.4;
      stroke-linecap: round;
      stroke-linejoin: round;
      opacity: .42;
    }

    .cut-accent,
    .bulk-accent {
      pointer-events: none;
      opacity: 0;
      mix-blend-mode: multiply;
    }

    .cut-accent {
      fill: var(--cut-color);
      opacity: calc(var(--cut-active) * .34);
    }

    .bulk-accent {
      fill: var(--bulk-color);
      opacity: calc(var(--bulk-active) * .34);
    }
  </style>

